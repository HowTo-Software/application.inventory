name: Bug report
description: Report a problem with the Computer Inventory system
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. **Do not include secrets, connection strings, or credentials.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API
        - Web (Blazor)
        - Thin Client Agent
        - Database / Migrations
        - Deployment scripts
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version or git commit SHA.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs here. Redact any secrets or connection strings first.
      render: shell
