name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Unit Tests
    # Windows runner: the solution includes Windows-targeted projects
    # (ThinClient agent / Windows Service) alongside the Blazor WASM app.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # global.json pins the 9.0 SDK; projects target net8.0, so install both.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ComputerInventory.sln

      - name: Build
        run: dotnet build ComputerInventory.sln --configuration Release --no-restore

      - name: Unit tests
        # Integration tests need a Linux SQL Server container; they run in the integration-tests job below.
        run: dotnet test ComputerInventory.sln --configuration Release --no-build --verbosity normal --filter 'FullyQualifiedName!~ComputerInventory.Tests.Integration'

  integration-tests:
    name: Integration Tests (SQL Server)
    # Ubuntu runner: Docker can run the Linux mcr.microsoft.com/mssql/server image
    # that Testcontainers boots for the integration suite.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Integration tests
        # Builds only the test project and its cross-platform dependencies (Core/Infrastructure/Contracts).
        run: dotnet test src/ComputerInventory.Tests/ComputerInventory.Tests.csproj --configuration Release --verbosity normal --filter 'FullyQualifiedName~ComputerInventory.Tests.Integration'
