<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Management</title>
    <base href="/" />
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
        img-src 'self' data: blob: https://tile.openstreetmap.org;
        font-src 'self' https://cdn.jsdelivr.net;
        connect-src 'self' ws: wss:;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " />
    <!-- Bootstrap CSS — local first, CDN fallback -->
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet"
          onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css';" />
    <!-- Bootstrap Icons — local first, CDN fallback -->
    <link href="lib/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"
          onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css';" />
    <!-- Leaflet CSS — local first, CDN fallback -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css"
          onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="ComputerInventory.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="d-flex justify-content-center align-items-center vh-100">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Loading Device Management...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Bootstrap JS — local first, CDN fallback -->
    <script src="lib/bootstrap/js/bootstrap.bundle.min.js"
            onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js';document.body.appendChild(s);"></script>
    <!-- Leaflet JS — local first, CDN fallback -->
    <script src="lib/leaflet/leaflet.js"
            onerror="var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';document.body.appendChild(s);"></script>
    <script src="js/site.js"></script>
</body>

</html>
